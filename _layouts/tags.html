---
layout: default
title: Tags
---
<section class="posts">
  <h1 class="page-h">{{ page.title }}</h1>
  <div class="tags-cloud">
    {% assign tags = site.tags | sort %}
    {% for tag in tags %}
    <a class="box" href="/tag/{{ tag | first | slugify }}/">{{ tag[0] }} ({{ tag | last | size }})</a>
    {% endfor %}
  </div>
</section>
