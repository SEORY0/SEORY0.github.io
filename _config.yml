site: Sidey
url: "https://SEORY0.github.io"
title: "SEORY0"
description: "Security Researcher & CTF Player. Windows Kernel Exploitation, Reverse Engineering, and AI for Security."
twitter:
  username: SEORY0
  card: summary_large_image
  creator: SEORY0
author:
  twitter: SEORY0
  name: "SEORY0"
  avatar: "/assets/images/profile.jpg"
  email: seory0@outlook.kr
  url: "https://SEORY0.github.io"

# Open Graph defaults: the share card, 1200 x 630, made by docs/art/og-image.py
# (also set as the default page image under defaults:, for jekyll-seo-tag)
og_image: "/assets/images/og-crt-cat.png"
og_image_alt: "SEORY0 in block letters beside an ASCII drawing of a cat on a CRT monitor"
locale: ko_KR
permalink: pretty

baseurl: ""

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    # line_numbers: true  <-- 이 옵션은 끄거나 주석 처리하세요! (CSS로 구현했습니다)
    # block:
    #   line_numbers: true
    span:
      line_numbers: false

exclude:
  - .jekyll-cache
  - DESIGN.md
  - docs

compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]

sass:
  sass_dir:          _sass
  style:            :compressed

plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap  

collections:
  pages:
    output: true
    permalink: /:name
  posts:
    output: true
    permalink: /:year/:month/:day/:slug
defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"
      # the share card for every page that does not set its own; jekyll-seo-tag
      # reads this (large card, size, alt) as well as _includes/head.html
      image:
        path: "/assets/images/og-crt-cat.png"
        width: 1200
        height: 630
        alt: "SEORY0 in block letters beside an ASCII drawing of a cat on a CRT monitor"
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
