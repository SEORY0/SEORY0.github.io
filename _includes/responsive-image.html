{%- assign image_widths = include.widths | default: '480,800,1200,1600' | split: ',' -%}
<a href="{{ include.path | append: '.jpg' | relative_url }}"><img
  src="{{ include.path | append: '-800.webp' | relative_url }}"
  srcset="{% for image_width in image_widths %}{{ include.path | append: '-' | append: image_width | append: '.webp' | relative_url }} {{ image_width }}w{% unless forloop.last %}, {% endunless %}{% endfor %}"
  sizes="{{ include.sizes | default: '(max-width: 750px) calc(100vw - 40px), (max-width: 1024px) min(calc(100vw - 64px), 732px), 764px' }}"
  width="{{ include.width }}" height="{{ include.height }}"
  style="width: {{ include.display_width | default: '100%' }}"
  alt="{{ include.alt | escape }}"
  loading="{% if include.priority %}eager{% else %}lazy{% endif %}"{% if include.priority %} fetchpriority="high"{% endif %}
  decoding="async"></a>
